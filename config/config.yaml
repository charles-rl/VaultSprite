# VaultSprite configuration (YAML).
# Relative paths resolve against the repository root.
# Machine-specific keys can be overridden via environment variables:
#   OLLAMA_BASE_URL, OLLAMA_MODEL, LLM_TIMEOUT_S, VISION_ENABLED, VAULT_ROOT, HEALTH_WORK_MIN

app:
  name: VaultSprite
  log_level: INFO

window:
  width: 89             # overlay window size in logical px (~0.7× the original 128; sprite scales to this)
  height: 89
  # NOTE: window.fps only affects the legacy (non-mascot) GIF SpritePlayer. When
  # mascot.enabled is true (the default), the Shimeji engine clock is mascot.tick_ms
  # instead — this key is informational/legacy and read by no code today.
  fps: 30               # legacy animation tick rate (frame-slicer timer)
  drag_threshold_px: 5      # press travel before a click becomes a drag (Manhattan distance)
  click_timeout_ms: 200     # no-move window that confirms a single click
  flick_speed_threshold: 80.0   # px/s at release required to inject an impulse
  max_drag_samples: 10

animation:
  config_path: assets/config.yaml    # sprite FSM matrix (states, frames, transitions)
  default_frame_ms: 100              # per-frame hold when a state omits duration_ms

stats:
  tick_ms: 60000                     # one decay step per minute
  initial: { hunger: 80, energy: 90, boredom: 10 }
  decay_per_tick: { hunger: -1, energy: -1, boredom: 2 }   # boredom climbs; others fall
  bounds: [0, 100]
  critical: { hunger: 25, energy: 20, boredom: 80 }        # edge-triggered signals on crossing
  pause_when_inactive: true      # decay only while ContextDetector reports WORK
  persist: true                  # save/restore stat values across launches (DyberPet idiom; atomic JSON, corrupt-tolerant)
  state_path: "state/stats.json" # snapshot location — deliberately OUTSIDE the Obsidian vault

physics:
  tick_ms: 30
  gravity_accel: 1.5             # px/tick^2 (koishi template)
  friction: 0.99                 # horizontal velocity damping per tick
  max_speed: 25.0                # px/tick hard cap (any axis)
  fall_terminal: 8.0             # explicit terminal falling speed, px/tick
  wall_bounce: -0.4              # x-velocity reflection at screen walls
  impulse_scale: 0.1             # converts release flick px/s to px/tick (doubled for a stronger throw)
  stand_on_windows: true         # land on foreground-window top edges (Windows only)

context:
  poll_ms: 5000                  # foreground-title polling cadence
  unknown_decay_polls: 6         # consecutive no-match polls (~30s) before context decays to UNKNOWN instead of sticking to the last bucket
  # substring-matched (case-insensitive) against the foreground window title.
  # "visual studio" + "studio code" cover both VS Code and VSCodium-style titles.
  work_keywords: [vs code, visual studio, studio code, terminal, obsidian, pycharm, intellij, sublime, notepad++, word, excel, slack, teams]
  play_keywords: [youtube, steam, reddit, netflix, twitch, discord, spotify, chrome]
  # Windows-only process channel (filled from the foreground window's exe name via WMI):
  # an EXACT app-name match wins over title keywords — so chrome.exe with a "docs" tab is
  # still PLAY. Entries are lowercase names WITH or WITHOUT .exe. Empty = disabled.
  work_apps: [code, msedge]        # editor / browser used for work tabs
  play_apps: [chrome, steam]       # browsers / clients that should count as play no matter the tab title

remote:
  ollama_base_url: https://my-ollama-server-11434.jpe1.devtunnels.ms/v1   # OpenAI-compatible; append /chat/completions
  ollama_model: hf.co/unsloth/Qwen3.8-27B-GGUF:UD-Q8_K_XL   # verified via `ollama ls`; OLLAMA_MODEL env overrides
  llm_timeout_s: 120                           # generous read timeout (remote H100)
  vision_enabled: true
  screenshot:
    max_w: 1024          # downscale target ~1024x768 per outline
    max_h: 768
    quality: 80          # JPEG quality (smaller payload than koishi's 95)
    format: jpeg
  ask_interval_ms: 300000     # autonomous vision cadence; 0 disables the loop
  fallback_line: "Sorry — I can't see clearly right now."   # shown when an LLM call fails/times out instead of leaving a dangling 'Thinking…' bubble
  vision_fail_cooldown_s: 300   # after any failed LLM call, autonomous asks pause this long (stop hammering a dead server)
  system_prompt: >-
    You are VaultSprite, a small desktop mascot that watches your screen.
    Reply in one short sentence (max 25 words). Reference what you actually see.

obsidian:
  vault_root: Vault          # env VAULT_ROOT; relative paths resolve from repo root
  events_dir: Memory/Events
  facts_dir: Memory/Facts
  journal_dir: Journal
  date_timezone: utc         # journal/event day bucketing (utc | local)
  max_size_mb: 50            # storage limit; vault_size_warning fires when exceeded (<=0 disables monitoring)
  size_check_ms: 300000      # periodic folder-size tick in App (also checked after every write); 0 disables the timer

health:
  work_threshold_min: 50     # continuous WORK minutes before a stretch nudge (outline: 45-60)
  nudge_tick_ms: 5000        # WorkTimer tick cadence
  use_os_idle: true          # gate "continuous work" on real OS input (Windows GetLastInputInfo; inactive elsewhere)
  afk_cutoff_s: 30           # after this many seconds without keyboard/mouse input, banked work-time resets (StretchBreak's frame-drop cutoff port)
  yawn_cooldown_s: 300       # min seconds between yawn SFX when the pet enters a lying-down/resting behavior (M8 doc §5.4: sleeping→yawn once)
  volume: { step: 0.7, chirp: 1.0, yawn: 0.8 }
  sounds_dir: assets/sounds

debug:                       # flip to false once troubleshooting is done (no code changes needed)
  vault_logging: true        # rolling trail in <vault>/Memory/Debug/{pet-states,context}.md (title+bucket on change)
  telemetry_overlay: false    # live on-screen telemetry window (coords, behavior, frame index)

hide:                        # "hide pet" — walk to the nearest edge, go fully off-screen, pause autonomy
  enabled: true              # when on, the tray/sprite menu offers Hide/Show; reveal returns to the pre-hide spot
  step_ms: 20                # walk-to-edge / walk-back step timer interval
  step_px: 6                 # px moved per step (walk speed)

mascot:                      # M9 behavior engine — plays a standard Shimeji pack's XML natively
  enabled: true              # when on, the Shimeji engine drives ambient animation + position; off = legacy GIF FSM
  pack: kazeem               # active pack under mascot.packs (steve | kazeem | dieter) — swap to change the pet
  packs:                     # standard community-pack layout: <pack>/conf/*.xml + <pack>/img/<Name>/*.png
    steve: assets/steve_shimeji
    kazeem: assets/kazeem_shimeji
    dieter: assets/dieter_shimeji   # ja-JP localized XML (parser normalizes tags/attrs/values)
  tick_ms: 40                # Shimeji action clock (~25 ticks/s, matches their Duration units)
  time_scale: 1.0            # multiplies pose durations (Shijima's userScale plumbing): <1 = livelier pet
  smooth_motion: true        # interpolate the window between engine ticks so throws look smooth on high-refresh monitors
  excluded_behaviors: [SplitIntoTwo, PullUpShimeji]   # solo-pet: breeding/divide stay off (frames 37-46 kept for later)
