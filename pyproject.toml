[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vaultsprite"
version = "0.1.0"
description = "VaultSprite — PySide6 desktop pet with sprite FSM, stat decay, taskbar terrain physics, screen vision via remote Ollama, and Obsidian vault memory."
readme = "README.md"
requires-python = ">=3.9,<3.15"
license = { text = "MIT" }
authors = [{ name = "VaultSprite" }]

dependencies = [
    # GUI (M1 overlay + all signal-based modules)
    "PySide6>=6.8",
    # Config + vault frontmatter
    "PyYAML>=6.0",
    # Screenshot pipeline (M6) — capture, resize, JPEG encode
    "Pillow>=10.0",
    "mss>=9.0",
    # Remote Ollama client (M6) — OpenAI-compatible endpoint
    "openai>=1.40",
    "httpx>=0.27",
    # Chiptune sound engine (M8) — guarded at runtime on headless boxes
    "pygame-ce>=2.5",
    # Windows-only OS APIs: terrain taskbar + context detector foreground window
    "pywin32>=306; sys_platform == 'win32'",
    "pywinctl>=0.4.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-env>=1.1",
    "pytest-qt>=4.4",
]

[project.scripts]
vaultsprite = "vaultsprite.main:main"

[tool.hatch.build.targets.wheel]
packages = ["vaultsprite"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
env = [
    "QT_QPA_PLATFORM=offscreen",
]
